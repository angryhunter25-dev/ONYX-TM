<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b0b"><title>ONYX Owner Panel</title>
<link rel="icon" href="logo.jpg">
<style>
:root{--bg:#0b0b0b;--card:#161616;--gold:#d4a84b;--tx:#f2f2f2;--mu:#9a9a9a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;padding-bottom:30px}
header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #222}
header img{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid var(--gold)}header h1{font-size:19px;margin:0;color:var(--gold)}
.w{padding:14px;max-width:560px;margin:auto}.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px;border:1px solid #242424}
label{font-size:12px;color:var(--mu)}input{width:100%;padding:11px;margin:3px 0 9px;border-radius:10px;border:1px solid #333;background:#101010;color:var(--tx);font-size:15px}
button{width:100%;padding:13px;border:0;border-radius:10px;font-size:16px;font-weight:700;background:var(--gold);color:#000}
.r{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.p{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #222;font-size:14px}
.p small{color:var(--mu)}.p button{width:auto;padding:6px 10px;font-size:12px;margin-left:4px}.d{background:#c62828;color:#fff}.ok{background:#2e7d32;color:#fff}
#msg{font-size:14px;margin-top:8px;color:var(--gold)}
</style></head><body>
<header><img src="logo.jpg" alt=""><h1>ONYX Owner Panel</h1></header>
<div class="w" id="app" style="display:none">
<div class="card"><b>Live Tournament Settings</b><br><br>
<label>Tournament Name</label><input id="name">
<div class="r"><div><label>Mode (Solo/Duo/Squad)</label><input id="mode"></div><div><label>Entry Fee (Rs)</label><input id="entry" type="number"></div>
<div><label>Per Kill (Rs)</label><input id="kill" type="number"></div><div><label>Booyah (Rs)</label><input id="booyah" type="number"></div>
<div><label>Best Player (Rs)</label><input id="best" type="number"></div><div><label>Date</label><input id="date"></div></div>
<label>Time</label><input id="time"><label>Notice (users ko dikhega)</label><input id="notice">
<button onclick="save()">Save &amp; Live Karo</button><div id="msg"></div></div>
<div class="card"><b>Players <span id="cnt"></span></b><div id="pl"></div></div>
</div>
<script src="auth.js"></script>
<script>
const DB="https://onyx-3127f-default-rtdb.asia-southeast1.firebasedatabase.app";/* wahi Firebase URL jo user app me hai */
const $=i=>document.getElementById(i);
async function get(p){if(DB)return(await fetch(`${DB}/${p}.json?auth=${await onyxAuth.token()}`)).json();return JSON.parse(localStorage.getItem("o_"+p.split("/")[0])||"null")}
async function put(p,v){if(DB){await fetch(`${DB}/${p}.json?auth=${await onyxAuth.token()}`,{method:"PUT",body:JSON.stringify(v)});return}
 const [k,id]=p.split("/");if(!id){localStorage.setItem("o_"+k,JSON.stringify(v));return}
 const o=JSON.parse(localStorage.getItem("o_"+k)||"{}");if(v===null)delete o[id];else o[id]=v;localStorage.setItem("o_"+k,JSON.stringify(o))}
const F=["name","mode","entry","kill","booyah","best","date","time","notice"];
onyxAuth({owner:true},()=>{$("app").style.display="block";init()});
async function init(){const c=(await get("config"))||{};F.forEach(k=>$(k).value=c[k]??"");players();setInterval(players,5000)}
async function save(){const c={};F.forEach(k=>{const v=$(k).value.trim();c[k]=["entry","kill","booyah","best"].includes(k)&&v!==""?Number(v):v});
 await put("config",c);$("msg").textContent="Live ho gaya ✔"}
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
async function players(){const o=(await get("players"))||{};const a=Object.values(o).sort((x,y)=>y.t-x.t);
 $("cnt").textContent="("+a.length+")";
 $("pl").innerHTML=a.map(p=>`<div class="p"><div>${esc(p.nm)}<br><small>FF: ${esc(p.ff)} • TG: ${esc(p.tg)}</small></div><div><button class="${p.paid?"ok":""}" onclick="paid('${esc(p.ff)}',${!p.paid})">${p.paid?"Paid":"Unpaid"}</button><button class="d" onclick="del('${esc(p.ff)}')">X</button></div></div>`).join("")||"<small>Abhi koi nahi</small>"}
async function paid(id,v){const o=(await get("players"))||{};if(o[id]){o[id].paid=v;await put("players/"+id,o[id]);players()}}
async function del(id){if(confirm("Delete?")){await put("players/"+id,null);players()}}
</script></body></html>
