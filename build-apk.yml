name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {key: user, name: "Shivam ONYX", id: com.shivam.onyx, page: index.html}
          - {key: owner, name: "ONYX Owner", id: com.shivam.onyxowner, page: owner-x7k2.html}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: Prepare web files
        run: |
          mkdir www
          cp auth.js logo.jpg www/
          cp "${{ matrix.page }}" www/index.html
      - name: Capacitor
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "${{ matrix.name }}" ${{ matrix.id }} --web-dir www
          npx cap add android
      - name: Icon
        continue-on-error: true
        run: |
          mkdir -p assets
          convert logo.jpg -resize 1024x1024 assets/icon-only.png
          npx @capacitor/assets generate --android --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000'
      - name: Build
        run: |
          npx cap sync android
          cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.key }}-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
